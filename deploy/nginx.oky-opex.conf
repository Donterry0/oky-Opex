# Sample Nginx reverse-proxy configuration for oky-Opex on a Hostinger VPS.
#
# Copy to /etc/nginx/sites-available/oky-opex.conf, replace "yourdomain.com",
# then:
#   sudo ln -s /etc/nginx/sites-available/oky-opex.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Afterwards run `sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com`
# to obtain a free Let's Encrypt certificate and enable HTTPS (Hostinger VPS
# ships with certbot, or install it via `apt install certbot python3-certbot-nginx`).
#
# See HOSTINGER_DEPLOYMENT.md for the full deployment walkthrough.

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
